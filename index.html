<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Avatar Live Canvas</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
    <!-- بارگذاری کتابخانه Three.js و ابزار لودر GLTF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        // ۱. ساخت صحنه، دوربین و رندرر
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.4, 2.5); // تنظیم دوربین در راستای قد آواتار

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ۲. نورپردازی صحنه (برای اینکه کاراکتر واضح و باکیفیت دیده شود)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // کنترل دوربین با موس (چرخش و زوم روی کاراکتر)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        // ۳. بارگذاری آواتار تمام‌قد شما
        const loader = new THREE.GLTFLoader();
        
        // آدرس فایل .glb خودت را که از Ready Player Me گرفتی اینجا بذار
       const avatarURL = 'https://models.readyplayer.me/66601b50d53c3d0c9f13c7a0.glb';

        loader.load(avatarURL, function (gltf) {
            const avatar = gltf.scene;
            avatar.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(avatar);
            console.log("آواتار با موفقیت بارگذاری شد!");
        }, undefined, function (error) {
            console.error("خطا در بارگذاری آواتار:", error);
        });

        // ۴. حلقه انیمیشن برای رندر مداوم صحنه
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // هماهنگ‌سازی اندازه صفحه در صورت تغییر سایز مرورگر
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
