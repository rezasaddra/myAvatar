<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>3D Avatar Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #202020; }
        #loader-info { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="loader-info">در حال بارگذاری آواتار...</div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        // ۱. تنظیمات صحنه
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ۲. نورپردازی
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 3);
        scene.add(dirLight);

        // ۳. کنترل دوربین
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);

        // ۴. بارگذاری آواتار
        const loader = new GLTFLoader();
        const avatarURL = 'https://models.readyplayer.me/66601b50d53c3d0c9f13c7a0.glb';

        loader.load(avatarURL, (gltf) => {
            const avatar = gltf.scene;
            avatar.scale.set(1, 1, 1); // تنظیم مقیاس
            scene.add(avatar);
            document.getElementById('loader-info').innerText = "آواتار با موفقیت بارگذاری شد!";
        }, (xhr) => {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            document.getElementById('loader-info').innerText = `در حال لود شدن: ${percent}%`;
        }, (error) => {
            console.error(error);
            document.getElementById('loader-info').innerText = "خطا در بارگذاری! کنسول را چک کنید.";
        });

        // ۵. رندر
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
